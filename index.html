<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crop Detection System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h1>Crop Detection System</h1>

    <input type="text" id="place" placeholder="Enter Place Name" required />
    <input type="text" id="soil" placeholder="Enter Soil Type" required />
    <input type="text" id="weather" placeholder="Enter Weather Conditions" required />

    <button onclick="detectCrop()">Detect Crop</button>

    <div id="resultContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
